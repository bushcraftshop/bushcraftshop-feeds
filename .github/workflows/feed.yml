name: Aanvullende Merchant-databron

on:
  schedule:
    - cron: "17 22 * * *" # dagelijks rond 23:17 Nederlandse wintertijd (00:17 zomertijd), vóór de nachtelijke ophaalronde van ChatGPT
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Feed bouwen uit Lightspeed
        env:
          LIGHTSPEED_API_KEY: ${{ secrets.LIGHTSPEED_API_KEY }}
          LIGHTSPEED_API_SECRET: ${{ secrets.LIGHTSPEED_API_SECRET }}
        run: python build_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
