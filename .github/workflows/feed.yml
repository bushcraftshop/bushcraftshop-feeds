name: Aanvullende Merchant-databron

on:
  schedule:
    - cron: "17 2 * * *"   # dagelijks rond 03:17 Nederlandse tijd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Feed bouwen uit Lightspeed
        env:
          LIGHTSPEED_API_KEY: ${{ secrets.LIGHTSPEED_API_KEY }}
          LIGHTSPEED_API_SECRET: ${{ secrets.LIGHTSPEED_API_SECRET }}
        run: python build_feed.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
